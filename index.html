<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlacePrep — Complete Placement Guide for Software & AI Roles</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // apply saved theme before paint
    (function () {
      var t = localStorage.getItem('pp_theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      if (localStorage.getItem('pp_code') === 'cpp') document.documentElement.setAttribute('data-code', 'cpp');
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
    <a href="#/" class="brand"><span class="brand-logo">🎯</span> PlacePrep</a>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search topics, concepts, flashcards…  ( / )" autocomplete="off" />
      <div id="searchResults" class="search-results hidden"></div>
    </div>
    <nav class="top-links">
      <a href="#/revise" title="Revision hub">⚡ <span>Revise</span></a>
      <a href="#/bookmarks" title="Bookmarks">🔖 <span>Saved</span></a>
      <a href="#/plan" title="Study plan">🗓️ <span>Plan</span></a>
    </nav>
    <div class="lang-switch" id="langSwitch" title="Language for code examples">
      <button type="button" data-lang="python">Python</button><button type="button" data-lang="cpp">C++</button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">🌓</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>
    <main id="app" class="content" tabindex="-1"></main>
  </div>

  <!-- Subject data (each file registers itself in window.SUBJECTS) -->
  <script src="data/dsa.js"></script>
  <script src="data/oop.js"></script>
  <script src="data/dbms.js"></script>
  <script src="data/os.js"></script>
  <script src="data/cn.js"></script>
  <script src="data/system-design.js"></script>
  <script src="data/ml.js"></script>
  <script src="data/dl-genai.js"></script>
  <script src="data/aptitude.js"></script>
  <script src="data/hr.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
